<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Issue Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Step 4: Application script loaded with defer -->
    <script src="js/app.js?v=2" defer></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Cloud Issue Tracker</h1>
      <p>Report and track simple technical issues.</p>
    </header>
    <main class="container">
      <section class="panel">
        <h2>Create Issue</h2>
        <form id="issue-form">
          <!-- Step 1: Added 'required' to the three form controls -->
          <label for="title">Title</label>
          <input id="title" name="title" type="text" required />

          <label for="description">Description</label>
          <textarea id="description" name="description" required></textarea>

          <label for="priority">Priority</label>
          <select id="priority" name="priority" required>
            <option>Low</option>
            <option selected>Medium</option>
            <option>High</option>
          </select>

          <button type="submit">Submit Issue</button>

          <!-- Step 2: Message area under the form -->
          <p id="form-message"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Current Issues</h2>
        <!-- Step 3: Replaced the static issue card with the Total Issues text and empty list container -->
        <p>Total issues: <span id="issue-count">0</span></p>
        <div id="issues-list"></div>
      </section>
    </main>
  </body>
</html>
